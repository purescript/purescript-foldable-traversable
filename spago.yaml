package:
  name: foldable-traversable
  description: Classes for foldable and traversable data structures
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 6.0.1
    license: BSD-3-Clause
    location:
      githubOwner: purescript
      githubRepo: purescript-foldable-traversable
  dependencies:
    - bifunctors: ">=6.0.0 <7.0.0"
    - const: ">=6.0.0 <7.0.0"
    - control: ">=6.0.0 <7.0.0"
    - either: ">=6.0.0 <7.0.0"
    - functors: ">=5.0.0 <6.0.0"
    - identity: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - orders: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - assert: ">=6.0.0 <7.0.0"
      - console: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
      - integers: ">=6.0.0 <7.0.0"
      - minibench: ">=4.0.0 <5.0.0"
      - numbers: ">=9.0.0 <10.0.0"
      - unsafe-coerce: ">=6.0.0 <7.0.0"
workspace: {}
